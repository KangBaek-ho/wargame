<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다리 전쟁 - Bridge War 3D</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; }

  #menu {
    position:fixed; inset:0; background:linear-gradient(160deg,#1b2a3d,#0a0f1a);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; z-index:50; text-align:center;
  }
  #menu h1 { font-size:44px; font-weight:900; letter-spacing:2px; margin-bottom:8px;
    background:linear-gradient(90deg,#ffd166,#ef476f); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #menu p.sub { color:#9fb3c8; margin-bottom:30px; font-size:14px; }
  .menuBtn {
    width:320px; padding:16px; margin:8px; font-size:17px; font-weight:700; color:#fff;
    background:#16324a; border:2px solid #2a4d6e; border-radius:10px; cursor:pointer; transition:.15s;
  }
  .menuBtn:hover { background:#1e4666; border-color:#ffd166; transform:translateY(-2px); }
  .panel { display:none; flex-direction:column; align-items:center; margin-top:14px; }
  .panel.show { display:flex; }
  .panel input { width:300px; padding:12px; font-size:15px; border-radius:8px; border:none; margin:8px 0; text-align:center; }
  .panel .go { background:#ef476f; }
  #hostCodeBox { color:#ffd166; font-size:22px; font-weight:900; letter-spacing:3px; margin:10px 0; background:#000a; padding:10px 20px; border-radius:8px; }
  #connStatus { color:#8fd19e; font-size:13px; min-height:18px; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; color:#fff; }
  #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:22px; }
  #crosshair::before,#crosshair::after { content:''; position:absolute; background:#fff; box-shadow:0 0 3px #000; }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }
  #crosshair::after { top:50%; left:0; height:2px; width:100%; transform:translateY(-50%); }

  #healthWrap { position:absolute; left:24px; bottom:24px; width:220px; }
  #healthBarBg { width:100%; height:22px; background:#0006; border:2px solid #fff5; border-radius:6px; overflow:hidden; }
  #healthBar { height:100%; width:100%; background:linear-gradient(90deg,#ef476f,#ff8fa3); transition:width .15s; }
  #hpText { font-size:13px; margin-top:4px; text-shadow:0 0 4px #000; }

  #weaponInfo { position:absolute; right:24px; bottom:24px; text-align:right; }
  #weaponName { font-size:20px; font-weight:900; text-shadow:0 0 5px #000; }
  #ammoText { font-size:26px; font-weight:900; text-shadow:0 0 5px #000; }

  #coinDisplay { position:absolute; top:20px; right:24px; font-size:20px; font-weight:900; color:#ffd166; text-shadow:0 0 5px #000; }
  #killFeed { position:absolute; top:20px; left:24px; font-size:14px; color:#fff; text-shadow:0 0 4px #000; display:flex; flex-direction:column; gap:4px; }
  #hint { position:absolute; bottom:60px; left:50%; transform:translateX(-50%); font-size:13px; color:#cde; text-shadow:0 0 4px #000; text-align:center; }
  #weaponSlots { position:absolute; bottom:56px; right:24px; display:flex; gap:6px; }
  .slot { width:34px; height:34px; background:#0007; border:1px solid #fff5; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#8899aa; }
  .slot.active { border-color:#ffd166; color:#ffd166; }
  .slot.locked { opacity:.3; }

  #shop { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#0e1b28ee; border:2px solid #2a4d6e; border-radius:14px; padding:24px; z-index:30; display:none; color:#fff; width:420px; pointer-events:auto; }
  #shop.show { display:block; }
  #shop h2 { text-align:center; margin-bottom:6px; }
  #shopCoins { text-align:center; color:#ffd166; font-weight:900; margin-bottom:16px; }
  .shopItem { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:#ffffff0d; border-radius:8px; margin-bottom:8px; }
  .shopItem .info b { display:block; }
  .shopItem .info span { font-size:12px; color:#9fb3c8; }
  .buyBtn { padding:8px 14px; border-radius:8px; border:none; font-weight:700; cursor:pointer; background:#3a86ff; color:#fff; }
  .buyBtn:disabled { background:#444; color:#888; cursor:not-allowed; }
  .buyBtn.owned { background:#2ecc71; }
  #shopClose { display:block; margin:14px auto 0; background:#ef476f; color:#fff; border:none; padding:8px 20px; border-radius:8px; cursor:pointer; font-weight:700; }

  #console { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); z-index:40; display:none; }
  #console.show { display:block; }
  #console input { width:340px; padding:10px 14px; border-radius:8px; border:2px solid #ffd166; background:#000c; color:#fff; font-size:14px; text-align:center; }

  #deathScreen { position:fixed; inset:0; background:#20000088; display:none; align-items:center; justify-content:center; flex-direction:column; z-index:35; color:#fff; }
  #deathScreen.show { display:flex; }
  #deathScreen h2 { font-size:40px; color:#ff5566; margin-bottom:10px; }

  #cheatMsg { position:fixed; top:80px; left:50%; transform:translateX(-50%); color:#ffd166; font-weight:900; font-size:20px; text-shadow:0 0 8px #000; z-index:40; display:none; }
</style>
</head>
<body>

<div id="menu">
  <h1>⚔ 다리 전쟁 ⚔</h1>
  <p class="sub">3D FPS · 섬 두 개, 그 사이 다리 하나 · 코인을 모아 무기를 사라</p>

  <div id="mainButtons">
    <button class="menuBtn" onclick="showPanel('ai')">🤖 AI와 전쟁하기</button>
    <button class="menuBtn" onclick="showPanel('host')">🌐 방 만들기 (플레이어와 전쟁)</button>
    <button class="menuBtn" onclick="showPanel('join')">🔑 방 참가하기</button>
  </div>

  <div id="aiPanel" class="panel">
    <p style="color:#cde;margin-bottom:8px;">난이도를 선택하세요</p>
    <button class="menuBtn" onclick="startGame('ai','easy')">쉬움</button>
    <button class="menuBtn" onclick="startGame('ai','normal')">보통</button>
    <button class="menuBtn" onclick="startGame('ai','hard')">어려움</button>
  </div>

  <div id="hostPanel" class="panel">
    <p style="color:#cde;">아래 코드를 상대에게 알려주세요</p>
    <div id="hostCodeBox">생성중...</div>
    <div id="connStatus">연결 대기중...</div>
  </div>

  <div id="joinPanel" class="panel">
    <input id="joinCodeInput" placeholder="방 코드 입력" />
    <button class="menuBtn go" onclick="joinRoom()">참가하기</button>
    <div id="connStatus2" class="connStatus"></div>
  </div>
</div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="healthWrap">
    <div id="healthBarBg"><div id="healthBar"></div></div>
    <div id="hpText">100 / 100</div>
  </div>
  <div id="weaponInfo">
    <div id="weaponName">소총</div>
    <div id="ammoText">30 / 90</div>
  </div>
  <div id="weaponSlots">
    <div class="slot" data-slot="1">1 소총</div>
    <div class="slot" data-slot="2">2 권총</div>
    <div class="slot" data-slot="3">3 칼</div>
    <div class="slot locked" data-slot="4">4 붕대</div>
    <div class="slot locked" data-slot="5">5 샷건</div>
    <div class="slot locked" data-slot="6">6 수류탄</div>
    <div class="slot locked" data-slot="7">7 RPG</div>
  </div>
  <div id="coinDisplay">🪙 0</div>
  <div id="killFeed"></div>
  <div id="hint">WASD 이동 · 스페이스 점프 · 좌클릭 공격 · R 재장전 · B 상점 · Enter 콘솔</div>
</div>

<div id="shop">
  <h2>🛒 상점</h2>
  <div id="shopCoins">보유 코인: 0</div>
  <div id="shopList"></div>
  <button id="shopClose" onclick="closeShop()">닫기 (B)</button>
</div>

<div id="console"><input id="consoleInput" placeholder="명령어 입력..." /></div>
<div id="cheatMsg">치트 활성화!</div>

<div id="deathScreen">
  <h2>사망</h2>
  <div id="respawnTimer">3초 후 부활...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
/* =========================================================
   다리 전쟁 - Bridge War 3D
========================================================= */

// ---------- 상수 ----------
const ISLAND_R = 25;
const ISLAND_A_X = -45, ISLAND_B_X = 45;
const BRIDGE_HALF_LEN = 22, BRIDGE_HALF_WID = 3.2;
const GRAVITY = -26, JUMP_SPEED = 9;
const EYE_H = 1.7;

function groundHeightAt(x,z){
  const dA = Math.hypot(x-ISLAND_A_X, z);
  const dB = Math.hypot(x-ISLAND_B_X, z);
  if (dA <= ISLAND_R) return 0;
  if (dB <= ISLAND_R) return 0;
  if (Math.abs(z) <= BRIDGE_HALF_WID && x >= -BRIDGE_HALF_LEN && x <= BRIDGE_HALF_LEN) return 0;
  return null; // 물/공중
}

// ---------- 무기 설정 (양측 동일) ----------
const WEAPONS = {
  rifle:   { name:'소총',   type:'hitscan', dmg:20, rate:130, mag:30, reserve:90, spread:0.015, auto:true },
  pistol:  { name:'권총',   type:'hitscan', dmg:16, rate:260, mag:12, reserve:48, spread:0.01,  auto:false },
  knife:   { name:'칼',     type:'melee',   dmg:55, range:2.6, rate:450 },
  bandage: { name:'붕대',   type:'heal',    heal:50, cost:20 },
  shotgun: { name:'샷건',   type:'hitscan', dmg:9, pellets:8, rate:800, mag:6, reserve:18, spread:0.09, cost:100 },
  grenade: { name:'수류탄', type:'grenade', dmg:100, radius:7, rate:900, cost:200, speed:22 },
  rpg:     { name:'RPG',    type:'rocket',  dmg:150, radius:9, rate:1400, cost:500, speed:38 }
};
const SHOP_ORDER = ['bandage','shotgun','grenade','rpg'];

// ---------- 상태 ----------
let mode = null; // 'ai' | 'host' | 'client'
let difficulty = 'normal';
let peer=null, conn=null, isHost=false;

let scene, camera, renderer, clock;
let keys = {};
let yaw=0, pitch=0;
let velocity = new THREE.Vector3();
let grounded = false;
let pointerLocked = false;

let local = {
  x:0, y:EYE_H, z:0, hp:100, maxHp:100, coins:0, alive:true,
  weapon:'rifle', ammo:{rifle:30,pistol:12,shotgun:6}, reserve:{rifle:90,pistol:48,shotgun:18},
  owned:{rifle:true,pistol:true,knife:true,bandage:0,shotgun:false,grenade:false,rpg:false},
  lastFire:0, lastKnife:0, reloading:false
};
let remote = {
  x:0, y:EYE_H, z:0, hp:100, maxHp:100, alive:true, weapon:'rifle', mesh:null, targetX:0, targetY:0, targetZ:0, targetYaw:0
};
let projectiles = []; // {mesh, vel, type, born, bounces}
let coinPickups = [];
let explosionFX = [];

// ---------- 메뉴 로직 ----------
function showPanel(which){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  if (which==='ai') document.getElementById('aiPanel').classList.add('show');
  if (which==='host') { document.getElementById('hostPanel').classList.add('show'); startHost(); }
  if (which==='join') document.getElementById('joinPanel').classList.add('show');
}

function startHost(){
  isHost = true; mode='host';
  const code = 'bw-' + Math.random().toString(36).slice(2,8);
  peer = new Peer(code);
  peer.on('open', id=>{
    document.getElementById('hostCodeBox').textContent = id.replace('bw-','');
  });
  peer.on('connection', c=>{
    conn = c;
    document.getElementById('connStatus').textContent = '연결됨! 게임을 시작합니다...';
    setupConn();
    setTimeout(()=>startGame('host'), 600);
  });
  peer.on('error', e=>{ document.getElementById('connStatus').textContent = '오류: '+e.type; });
}

function joinRoom(){
  const code = 'bw-' + document.getElementById('joinCodeInput').value.trim();
  document.getElementById('connStatus2').textContent = '연결 시도중...';
  isHost = false; mode='client';
  peer = new Peer();
  peer.on('open', ()=>{
    conn = peer.connect(code, {reliable:true});
    conn.on('open', ()=>{
      document.getElementById('connStatus2').textContent = '연결됨! 게임을 시작합니다...';
      setupConn();
      setTimeout(()=>startGame('client'), 600);
    });
  });
  peer.on('error', e=>{ document.getElementById('connStatus2').textContent = '오류: '+e.type; });
}

function setupConn(){
  conn.on('data', data=>{
    if (data.t==='state'){
      remote.targetX=data.x; remote.targetY=data.y; remote.targetZ=data.z; remote.targetYaw=data.yaw;
      remote.weapon = data.weapon;
    } else if (data.t==='hit'){
      applyDamageLocal(data.dmg, data.by||'상대');
    } else if (data.t==='fx'){
      spawnRemoteFX(data);
    } else if (data.t==='coin'){
      // just for kill feed flavor, ignored otherwise
    } else if (data.t==='dead'){
      addKillFeed(`상대가 쓰러졌습니다`);
    }
  });
}

function send(obj){ if (conn && conn.open) conn.send(obj); }

// ---------- 게임 시작 ----------
function startGame(m, diff){
  mode = m; if (diff) difficulty = diff;
  document.getElementById('menu').style.display='none';
  document.getElementById('hud').style.display='block';
  initThree();
  spawnLocal();
  if (mode==='ai') spawnBot();
  else spawnRemoteMesh();
  spawnCoinPickups();
  requestPointerLock();
  updateWeaponUI();
  buildShop();
  animate();
}

function requestPointerLock(){
  renderer.domElement.requestPointerLock();
}

// ---------- THREE 초기화 ----------
function initThree(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd0ec);
  scene.fog = new THREE.Fog(0x8fd0ec, 60, 220);

  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  camera.rotation.order = 'YXZ';

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2d0, 1.1);
  sun.position.set(60,90,30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-90; sun.shadow.camera.right=90;
  sun.shadow.camera.top=90; sun.shadow.camera.bottom=-90;
  scene.add(sun);

  // 물
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(2000,2000),
    new THREE.MeshPhongMaterial({color:0x1c6ea4, shininess:60, transparent:true, opacity:0.9})
  );
  water.rotation.x = -Math.PI/2; water.position.y=-3.4;
  scene.add(water);

  buildIsland(ISLAND_A_X, 0xff6b6b); // A: 붉은팀 색 포인트
  buildIsland(ISLAND_B_X, 0x4d96ff); // B: 파란팀 색 포인트
  buildBridge();

  window.addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  clock = new THREE.Clock();
}

function buildIsland(cx, accent){
  const topMat = new THREE.MeshStandardMaterial({color:0x4a8f3c, roughness:0.95});
  const sideMat = new THREE.MeshStandardMaterial({color:0x8a6a45, roughness:1});
  const geo = new THREE.CylinderGeometry(ISLAND_R, ISLAND_R+3, 4, 40);
  const island = new THREE.Mesh(geo, [sideMat, topMat, topMat]);
  island.position.set(cx, -2, 0);
  island.receiveShadow = true;
  scene.add(island);

  // 색 포인트 링 (팀 구분용, 시각적)
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(ISLAND_R*0.35, 0.4, 8, 40),
    new THREE.MeshStandardMaterial({color:accent, emissive:accent, emissiveIntensity:0.4})
  );
  ring.rotation.x = Math.PI/2;
  ring.position.set(cx, 0.05, 0);
  scene.add(ring);

  // 나무 몇 그루 (장식)
  for(let i=0;i<8;i++){
    const ang = Math.random()*Math.PI*2;
    const r = 6 + Math.random()*(ISLAND_R-10);
    const tx = cx + Math.cos(ang)*r, tz = Math.sin(ang)*r;
    if (Math.hypot(tx-cx,tz) < 8) continue;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,2.4,6), new THREE.MeshStandardMaterial({color:0x6b4423}));
    trunk.position.set(tx, 1.2, tz); trunk.castShadow=true;
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.6,3,8), new THREE.MeshStandardMaterial({color:0x2f7d32}));
    leaves.position.set(tx, 3.4, tz); leaves.castShadow=true;
    scene.add(trunk); scene.add(leaves);
  }

  // 엄폐물 박스
  for(let i=0;i<5;i++){
    const ang = Math.random()*Math.PI*2;
    const r = 4 + Math.random()*(ISLAND_R-10);
    const bx = cx + Math.cos(ang)*r, bz = Math.sin(ang)*r;
    const box = new THREE.Mesh(new THREE.BoxGeometry(2.2,1.4,2.2), new THREE.MeshStandardMaterial({color:0x999999}));
    box.position.set(bx, 0.7, bz); box.castShadow=true; box.receiveShadow=true;
    scene.add(box);
  }
}

function buildBridge(){
  const plankMat = new THREE.MeshStandardMaterial({color:0x8b5a2b, roughness:0.9});
  const deck = new THREE.Mesh(new THREE.BoxGeometry(BRIDGE_HALF_LEN*2+6, 1, BRIDGE_HALF_WID*2), plankMat);
  deck.position.set(0,0,0); deck.receiveShadow=true; deck.castShadow=true;
  scene.add(deck);
  // 난간
  const railMat = new THREE.MeshStandardMaterial({color:0x5a3a1a});
  for (const zs of [-1,1]){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(BRIDGE_HALF_LEN*2+6, 0.9, 0.2), railMat);
    rail.position.set(0, 0.9, zs*BRIDGE_HALF_WID);
    scene.add(rail);
    for(let x=-BRIDGE_HALF_LEN; x<=BRIDGE_HALF_LEN; x+=6){
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.25,1.2,0.25), railMat);
      post.position.set(x, 0.6, zs*BRIDGE_HALF_WID);
      scene.add(post);
    }
  }
  // 기둥
  for (const x of [-14,0,14]){
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,7,10), new THREE.MeshStandardMaterial({color:0x555555}));
    pillar.position.set(x,-4,0); scene.add(pillar);
  }
}

// ---------- 플레이어 스폰 ----------
function spawnLocal(){
  const spawnX = (mode==='client') ? ISLAND_B_X : ISLAND_A_X;
  local.x = spawnX; local.z = 0; local.y = EYE_H; local.hp=100; local.alive=true;
  yaw = (mode==='client') ? Math.PI : 0; pitch=0;
  camera.position.set(local.x, local.y, local.z);
}

function spawnRemoteMesh(){
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.5,1.2,4,8) : new THREE.CylinderGeometry(0.5,0.5,1.8,8),
    new THREE.MeshStandardMaterial({color:0xff5555}));
  body.position.y = 1; body.castShadow=true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,10,10), new THREE.MeshStandardMaterial({color:0xffdbac}));
  head.position.y = 1.9;
  grp.add(body); grp.add(head);
  remote.mesh = grp;
  const spawnX = (mode==='client') ? ISLAND_A_X : ISLAND_B_X;
  grp.position.set(spawnX, 0, 0);
  remote.x=spawnX; remote.z=0; remote.targetX=spawnX; remote.targetZ=0;
  scene.add(grp);
}

let bot = null;
function spawnBot(){
  spawnRemoteMesh();
  bot = { hp:100, maxHp:100, alive:true, x:ISLAND_B_X, z:0, lastFire:0, lastGrenade:0, state:'advance', speed: difficulty==='easy'?2.6:(difficulty==='hard'?4.6:3.5), acc: difficulty==='easy'?0.35:(difficulty==='hard'?0.85:0.6) };
  remote.hp = bot.hp; remote.maxHp=bot.maxHp;
}

function spawnCoinPickups(){
  coinPickups = [];
  const spots = [];
  for (const cx of [ISLAND_A_X, ISLAND_B_X]){
    for(let i=0;i<4;i++){
      const ang = (i/4)*Math.PI*2 + Math.random();
      const r = 8+Math.random()*12;
      spots.push({x:cx+Math.cos(ang)*r, z:Math.sin(ang)*r});
    }
  }
  for (const s of spots){
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.15,16), new THREE.MeshStandardMaterial({color:0xffd166, emissive:0x664400, metalness:0.6, roughness:0.3}));
    mesh.rotation.x = Math.PI/2;
    mesh.position.set(s.x, 1, s.z);
    scene.add(mesh);
    coinPickups.push({mesh, x:s.x, z:s.z, active:true, respawnAt:0});
  }
}

// ---------- 입력 ----------
document.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if (e.code==='Digit1') switchWeapon('rifle');
  if (e.code==='Digit2') switchWeapon('pistol');
  if (e.code==='Digit3') switchWeapon('knife');
  if (e.code==='Digit4') useBandage();
  if (e.code==='Digit5') switchWeapon('shotgun');
  if (e.code==='Digit6') switchWeapon('grenade');
  if (e.code==='Digit7') switchWeapon('rpg');
  if (e.code==='KeyR') reload();
  if (e.code==='KeyB') toggleShop();
  if (e.code==='Enter'){
    const c = document.getElementById('console');
    if (c.classList.contains('show')){
      submitConsole();
    } else if (mode) {
      c.classList.add('show');
      document.getElementById('consoleInput').focus();
      document.exitPointerLock();
    }
  }
  if (e.code==='Escape'){
    document.getElementById('console').classList.remove('show');
  }
});
document.addEventListener('keyup', e=>{ keys[e.code]=false; });

document.addEventListener('mousemove', e=>{
  if (!pointerLocked) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, pitch));
});

document.addEventListener('click', ()=>{
  if (mode && !document.getElementById('console').classList.contains('show') && !document.getElementById('shop').classList.contains('show')){
    if (!pointerLocked) { requestPointerLock(); return; }
    fireStart = true;
    tryFire();
  }
});
document.addEventListener('mousedown', e=>{ if(e.button===0 && pointerLocked) fireHeld=true; });
document.addEventListener('mouseup', e=>{ if(e.button===0) fireHeld=false; });

document.addEventListener('pointerlockchange', ()=>{
  pointerLocked = document.pointerLockElement === renderer.domElement;
});

let fireHeld=false, fireStart=false;

function switchWeapon(name){
  if (name==='shotgun' && !local.owned.shotgun) return;
  if (name==='grenade' && !local.owned.grenade) return;
  if (name==='rpg' && !local.owned.rpg) return;
  local.weapon = name;
  updateWeaponUI();
}

function useBandage(){
  if (local.owned.bandage>0 && local.hp<local.maxHp){
    local.owned.bandage--;
    local.hp = Math.min(local.maxHp, local.hp+WEAPONS.bandage.heal);
    updateHUD(); updateWeaponUI();
    addKillFeed('붕대 사용 (+50 HP)');
  }
}

// ---------- 콘솔 / 치트 ----------
function submitConsole(){
  const input = document.getElementById('consoleInput');
  const val = input.value.trim();
  input.value=''; document.getElementById('console').classList.remove('show');
  if (val === 'I love .RPG!'){
    local.coins += 9999;
    local.owned.shotgun = true; local.owned.grenade = true; local.owned.rpg = true; local.owned.bandage += 5;
    local.ammo.shotgun = WEAPONS.shotgun.mag; local.reserve.shotgun = WEAPONS.shotgun.reserve;
    showCheatMsg();
    updateWeaponUI(); updateHUD(); buildShop();
  }
  requestPointerLock();
}
function showCheatMsg(){
  const el = document.getElementById('cheatMsg');
  el.style.display='block';
  setTimeout(()=>el.style.display='none', 2000);
}

// ---------- 상점 ----------
function toggleShop(){
  const s = document.getElementById('shop');
  if (s.classList.contains('show')) closeShop();
  else { s.classList.add('show'); document.exitPointerLock(); buildShop(); }
}
function closeShop(){
  document.getElementById('shop').classList.remove('show');
  requestPointerLock();
}
function buildShop(){
  document.getElementById('shopCoins').textContent = `보유 코인: ${local.coins}`;
  const list = document.getElementById('shopList');
  list.innerHTML='';
  for (const key of SHOP_ORDER){
    const w = WEAPONS[key];
    const owned = key==='bandage' ? false : local.owned[key];
    const div = document.createElement('div');
    div.className='shopItem';
    const desc = key==='bandage' ? '체력 +50 회복 (소모품)' :
                 key==='shotgun' ? '근거리 산탄, 8발 산탄' :
                 key==='grenade' ? '투척, 폭발 스플래시 데미지' :
                 '직격/스플래시 대미지, 강력함';
    div.innerHTML = `<div class="info"><b>${w.name} (${w.cost} 코인)</b><span>${desc}</span></div>`;
    const btn = document.createElement('button');
    btn.className='buyBtn';
    if (key==='bandage'){
      btn.textContent = `구매 (보유:${local.owned.bandage})`;
      btn.disabled = local.coins < w.cost;
      btn.onclick = ()=>buyItem(key);
    } else {
      btn.textContent = owned ? '보유중' : '구매';
      if (owned) btn.classList.add('owned');
      btn.disabled = owned || local.coins < w.cost;
      btn.onclick = ()=>buyItem(key);
    }
    div.appendChild(btn);
    list.appendChild(div);
  }
}
function buyItem(key){
  const w = WEAPONS[key];
  if (local.coins < w.cost) return;
  local.coins -= w.cost;
  if (key==='bandage') local.owned.bandage++;
  else {
    local.owned[key]=true;
    if (key==='shotgun'){ local.ammo.shotgun=w.mag; local.reserve.shotgun=w.reserve; }
  }
  buildShop(); updateWeaponUI(); updateHUD();
}

// ---------- 발사 로직 ----------
function tryFire(){
  const w = WEAPONS[local.weapon];
  const now = performance.now();
  if (!local.alive) return;
  if (now - local.lastFire < w.rate) return;
  if (w.type==='melee'){
    if (now - local.lastKnife < w.rate) return;
    local.lastKnife = now;
    doMelee(w);
    return;
  }
  if (w.type==='heal') return;
  if (w.type==='hitscan'){
    if (local.ammo[local.weapon] <= 0){ addKillFeed('탄약 없음! R로 재장전'); return; }
    if (local.reloading) return;
    local.ammo[local.weapon]--;
    local.lastFire = now;
    doHitscan(w);
    updateWeaponUI();
  } else if (w.type==='grenade' || w.type==='rocket'){
    local.lastFire = now;
    doProjectile(w, local.weapon);
  }
}

function getAimDir(){
  const dir = new THREE.Vector3(0,0,-1);
  dir.applyEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));
  return dir;
}

function doMelee(w){
  const dir = getAimDir();
  const origin = camera.position.clone();
  const targetPos = mode==='ai' ? new THREE.Vector3(remote.x, 1.2, remote.z) : new THREE.Vector3(remote.mesh.position.x,1.2,remote.mesh.position.z);
  const toTarget = targetPos.clone().sub(origin);
  const dist = toTarget.length();
  if (dist <= w.range){
    const angle = dir.angleTo(toTarget.normalize());
    if (angle < 0.5){
      hitOpponent(w.dmg, '칼');
    }
  }
  send({t:'fx', kind:'knife', x:origin.x,y:origin.y,z:origin.z});
}

function doHitscan(w){
  const pellets = w.pellets || 1;
  const origin = camera.position.clone();
  let anyHit=false;
  for (let i=0;i<pellets;i++){
    const dir = getAimDir();
    dir.x += (Math.random()-0.5)*w.spread;
    dir.y += (Math.random()-0.5)*w.spread;
    dir.z += (Math.random()-0.5)*w.spread;
    dir.normalize();
    const raycaster = new THREE.Raycaster(origin, dir, 0, 200);
    const targetPos = mode==='ai' ? new THREE.Vector3(remote.x, 1.1, remote.z) : new THREE.Vector3(remote.mesh.position.x,1.1,remote.mesh.position.z);
    // 점-선 거리로 근사 판정 (구체 반지름 0.9)
    const toTarget = targetPos.clone().sub(origin);
    const proj = toTarget.dot(dir);
    if (proj>0 && proj<200){
      const closest = origin.clone().add(dir.clone().multiplyScalar(proj));
      const d = closest.distanceTo(targetPos);
      if (d < 0.95){ anyHit=true; hitOpponent(w.dmg, w.name); }
    }
  }
  spawnTracer(origin, getAimDir());
  send({t:'fx', kind:'shot', x:origin.x,y:origin.y,z:origin.z, yaw, pitch});
}

function spawnTracer(origin, dir){
  const end = origin.clone().add(dir.clone().multiplyScalar(60));
  const geo = new THREE.BufferGeometry().setFromPoints([origin, end]);
  const mat = new THREE.LineBasicMaterial({color:0xfff2a0, transparent:true, opacity:0.8});
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  let t=0;
  const fade = ()=>{ t+=1; mat.opacity -= 0.15; if (mat.opacity<=0){ scene.remove(line); return;} requestAnimationFrame(fade); };
  fade();
}

function doProjectile(w, type){
  const dir = getAimDir();
  const geo = type==='rpg' ? new THREE.CylinderGeometry(0.12,0.12,0.6,8) : new THREE.SphereGeometry(0.25,10,10);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: type==='rpg'?0x333333:0x2e7d32, emissive:0x220000}));
  mesh.position.copy(camera.position);
  if (type==='rpg') mesh.lookAt(mesh.position.clone().add(dir));
  scene.add(mesh);
  const vel = dir.clone().multiplyScalar(w.speed);
  if (type==='grenade') vel.y += 4;
  projectiles.push({mesh, vel, type, born:performance.now(), owner:'local'});
}

function updateProjectiles(dt){
  for (let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    if (p.type==='grenade') p.vel.y += GRAVITY*dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    const gh = groundHeightAt(p.mesh.position.x, p.mesh.position.z);
    const age = performance.now()-p.born;

    let explode=false;
    if (p.type==='grenade'){
      if (gh!==null && p.mesh.position.y <= gh+0.3){
        p.mesh.position.y = gh+0.3; p.vel.y = Math.abs(p.vel.y)*0.35; p.vel.x*=0.8; p.vel.z*=0.8;
      }
      if (age > 2500) explode=true;
    } else if (p.type==='rpg'){
      if (gh===null && p.mesh.position.y < -3) explode=true; // 물에 빠짐
      else if (gh!==null && p.mesh.position.y <= gh+0.3) explode=true;
      if (age > 3000) explode=true;
    }
    // 상대 근접 판정
    if (!explode && p.owner==='local'){
      const targetPos = mode==='ai' ? new THREE.Vector3(remote.x,1,remote.z) : new THREE.Vector3(remote.mesh.position.x,1,remote.mesh.position.z);
      if (p.mesh.position.distanceTo(targetPos) < 1.2) explode=true;
    }

    if (explode){
      handleExplosion(p.mesh.position.clone(), WEAPONS[p.type]);
      scene.remove(p.mesh);
      projectiles.splice(i,1);
    } else if (p.mesh.position.y < -20){
      scene.remove(p.mesh); projectiles.splice(i,1);
    }
  }
}

function handleExplosion(pos, w){
  spawnExplosionFX(pos);
  send({t:'fx', kind:'explosion', x:pos.x, y:pos.y, z:pos.z});
  const targetPos = mode==='ai' ? new THREE.Vector3(remote.x,1,remote.z) : new THREE.Vector3(remote.mesh.position.x,1,remote.mesh.position.z);
  const d = pos.distanceTo(targetPos);
  let dmg=0;
  if (d < w.radius) dmg = w.dmg * (1 - d/w.radius*0.7);
  else if (d < w.radius*1.6) dmg = 10; // 빗맞아도 살짝 데미지
  if (dmg>0) hitOpponent(Math.round(dmg), w.name===undefined?'폭발':w.name);
}

function spawnExplosionFX(pos){
  const geo = new THREE.SphereGeometry(1,12,12);
  const mat = new THREE.MeshBasicMaterial({color:0xffaa33, transparent:true, opacity:0.9});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  scene.add(mesh);
  let scale=1;
  const grow = ()=>{
    scale += 0.5; mesh.scale.setScalar(scale); mat.opacity -= 0.08;
    if (mat.opacity<=0){ scene.remove(mesh); return; }
    requestAnimationFrame(grow);
  };
  grow();
}
function spawnRemoteFX(data){
  if (data.kind==='explosion') spawnExplosionFX(new THREE.Vector3(data.x,data.y,data.z));
}

// ---------- 피해 처리 ----------
function hitOpponent(dmg, srcName){
  if (mode==='ai'){
    if (!bot.alive) return;
    bot.hp -= dmg;
    if (bot.hp <= 0){ bot.hp=0; bot.alive=false; onBotDeath(); }
    remote.hp = bot.hp;
  } else {
    send({t:'hit', dmg, by:srcName});
  }
}
function applyDamageLocal(dmg, by){
  if (!local.alive) return;
  local.hp -= dmg;
  updateHUD();
  if (local.hp<=0){ local.hp=0; onLocalDeath(); }
}
function onBotDeath(){
  addKillFeed('상대를 처치했습니다! +30 코인');
  local.coins += 30; updateHUD(); buildShop();
  setTimeout(()=>{
    bot.alive=true; bot.hp=100; bot.x=ISLAND_B_X; bot.z=0;
    remote.hp=100; remote.x=bot.x; remote.z=bot.z;
    if (remote.mesh) remote.mesh.position.set(bot.x,0,bot.z);
  }, 3000);
}
function onLocalDeath(){
  local.alive=false;
  document.getElementById('deathScreen').classList.add('show');
  document.exitPointerLock();
  send({t:'dead'});
  let t=3;
  document.getElementById('respawnTimer').textContent = `${t}초 후 부활...`;
  const iv = setInterval(()=>{
    t--;
    document.getElementById('respawnTimer').textContent = `${t}초 후 부활...`;
    if (t<=0){
      clearInterval(iv);
      respawnLocal();
    }
  },1000);
}
function respawnLocal(){
  local.alive=true; local.hp=local.maxHp;
  const spawnX = (mode==='client') ? ISLAND_B_X : ISLAND_A_X;
  local.x=spawnX; local.z=0; camera.position.set(local.x, EYE_H, local.z);
  local.ammo.rifle=WEAPONS.rifle.mag; local.reserve.rifle=WEAPONS.rifle.reserve;
  local.ammo.pistol=WEAPONS.pistol.mag; local.reserve.pistol=WEAPONS.pistol.reserve;
  if (local.owned.shotgun){ local.ammo.shotgun=WEAPONS.shotgun.mag; local.reserve.shotgun=WEAPONS.shotgun.reserve; }
  document.getElementById('deathScreen').classList.remove('show');
  requestPointerLock();
  updateHUD(); updateWeaponUI();
}

function reload(){
  const w = WEAPONS[local.weapon];
  if (w.type!=='hitscan') return;
  if (local.reloading) return;
  if (local.ammo[local.weapon] >= w.mag) return;
  if (local.reserve[local.weapon] <= 0) return;
  local.reloading = true;
  addKillFeed('재장전중...');
  setTimeout(()=>{
    const need = w.mag - local.ammo[local.weapon];
    const take = Math.min(need, local.reserve[local.weapon]);
    local.ammo[local.weapon] += take;
    local.reserve[local.weapon] -= take;
    local.reloading = false;
    updateWeaponUI();
  }, 1100);
}

// ---------- 킬피드 ----------
function addKillFeed(text){
  const kf = document.getElementById('killFeed');
  const div = document.createElement('div');
  div.textContent = text;
  kf.appendChild(div);
  setTimeout(()=>div.remove(), 3500);
  while (kf.children.length>5) kf.removeChild(kf.firstChild);
}

// ---------- HUD ----------
function updateHUD(){
  const pct = Math.max(0, local.hp/local.maxHp*100);
  document.getElementById('healthBar').style.width = pct+'%';
  document.getElementById('hpText').textContent = `${Math.max(0,Math.round(local.hp))} / ${local.maxHp}`;
  document.getElementById('coinDisplay').textContent = `🪙 ${local.coins}`;
}
function updateWeaponUI(){
  const w = WEAPONS[local.weapon];
  document.getElementById('weaponName').textContent = w.name;
  if (w.type==='hitscan') document.getElementById('ammoText').textContent = `${local.ammo[local.weapon]} / ${local.reserve[local.weapon]}`;
  else if (w.type==='melee') document.getElementById('ammoText').textContent = '근접무기';
  else if (w.type==='grenade' || w.type==='rocket') document.getElementById('ammoText').textContent = '투척/발사';
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('active'));
  const map = {rifle:1,pistol:2,knife:3,bandage:4,shotgun:5,grenade:6,rpg:7};
  const activeSlot = document.querySelector(`.slot[data-slot="${map[local.weapon]}"]`);
  if (activeSlot) activeSlot.classList.add('active');
  document.querySelector('.slot[data-slot="5"]').classList.toggle('locked', !local.owned.shotgun);
  document.querySelector('.slot[data-slot="6"]').classList.toggle('locked', !local.owned.grenade);
  document.querySelector('.slot[data-slot="7"]').classList.toggle('locked', !local.owned.rpg);
  document.querySelector('.slot[data-slot="4"]').classList.toggle('locked', local.owned.bandage<=0);
  updateHUD();
}

// ---------- 이동 처리 ----------
function updateMovement(dt){
  if (!local.alive) return;
  const forward = new THREE.Vector3(Math.sin(yaw)*-1,0,Math.cos(yaw)*-1);
  const right = new THREE.Vector3(forward.z*-1,0,forward.x);
  let move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyA']) move.sub(right);
  if (keys['KeyD']) move.add(right);
  if (move.lengthSq()>0) move.normalize().multiplyScalar(6.5*dt);

  let nx = local.x+move.x, nz = local.z+move.z;
  const gh = groundHeightAt(nx,nz);
  if (gh!==null){ local.x=nx; local.z=nz; }
  else {
    // 슬라이딩 시도: x, z 축 각각
    const gx = groundHeightAt(local.x+move.x, local.z);
    const gz = groundHeightAt(local.x, local.z+move.z);
    if (gx!==null) local.x += move.x;
    if (gz!==null) local.z += move.z;
  }

  const groundY = groundHeightAt(local.x, local.z);
  if (groundY===null){
    // 공중/낙하 (다리나 섬 밖 -> 낙하)
    velocity.y += GRAVITY*dt;
    local.y += velocity.y*dt;
    grounded = false;
    if (local.y < -6){
      applyDamageLocal(999,'낙사'); // 물에 빠지면 사망
    }
  } else {
    const targetY = groundY+EYE_H;
    if (local.y > targetY){
      velocity.y += GRAVITY*dt;
      local.y += velocity.y*dt;
      if (local.y <= targetY){ local.y=targetY; velocity.y=0; grounded=true; }
    } else {
      local.y = targetY; velocity.y=0; grounded=true;
      if (keys['Space']) { velocity.y = JUMP_SPEED; grounded=false; }
    }
  }

  camera.position.set(local.x, local.y, local.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}

// ---------- 코인 픽업 ----------
function updateCoins(dt){
  const now = performance.now();
  for (const c of coinPickups){
    c.mesh.rotation.z += dt*2;
    if (!c.active){
      if (now > c.respawnAt){ c.active=true; c.mesh.visible=true; }
      continue;
    }
    if (Math.hypot(local.x-c.x, local.z-c.z) < 1.6){
      c.active=false; c.mesh.visible=false; c.respawnAt = now+15000;
      local.coins += 10; updateHUD(); buildShop();
    }
  }
}

// ---------- 봇 AI ----------
function updateBot(dt){
  if (!bot) return;
  if (!bot.alive){
    remote.mesh.position.set(bot.x, 0, bot.z);
    return;
  }
  const px = local.x, pz = local.z;
  const dist = Math.hypot(px-bot.x, pz-bot.z);

  // 목표 지점: 다리 중앙 쪽으로 전진하거나 플레이어 추적
  let tx = bot.x, tz = bot.z;
  if (dist > 14){
    tx = 0; tz = (Math.random()-0.5)*2; // 다리로 전진
  } else {
    tx = px + (Math.random()-0.5)*3; tz = pz + (Math.random()-0.5)*3;
  }
  const dx = tx-bot.x, dz = tz-bot.z;
  const dlen = Math.hypot(dx,dz)||1;
  const nx = bot.x + (dx/dlen)*bot.speed*dt;
  const nz = bot.z + (dz/dlen)*bot.speed*dt;
  if (groundHeightAt(nx,nz)!==null){ bot.x=nx; bot.z=nz; }

  remote.mesh.position.set(bot.x, 0, bot.z);
  const faceAngle = Math.atan2(px-bot.x, pz-bot.z);
  remote.mesh.rotation.y = faceAngle;

  const now = performance.now();
  if (dist < 40 && now - bot.lastFire > 350){
    bot.lastFire = now;
    if (Math.random() < bot.acc){
      applyDamageLocal(Math.round(8+Math.random()*10), '적');
    }
  }
  if (dist < 20 && now - bot.lastGrenade > 8000 && Math.random()<0.5){
    bot.lastGrenade = now;
    handleExplosion(new THREE.Vector3(px + (Math.random()-0.5)*3, 1, pz+(Math.random()-0.5)*3), WEAPONS.grenade);
  }
}

// ---------- 원격 플레이어(멀티) 보간 ----------
function updateRemoteInterp(dt){
  if (mode==='ai' || !remote.mesh) return;
  remote.mesh.position.x += (remote.targetX-remote.mesh.position.x)*Math.min(1,dt*10);
  remote.mesh.position.z += (remote.targetZ-remote.mesh.position.z)*Math.min(1,dt*10);
  remote.mesh.rotation.y = remote.targetYaw||0;
}

// ---------- 네트워크 상태 전송 ----------
let lastSend=0;
function sendState(){
  const now=performance.now();
  if (now-lastSend<50) return;
  lastSend=now;
  send({t:'state', x:local.x,y:local.y,z:local.z, yaw, weapon:local.weapon});
}

// ---------- 메인 루프 ----------
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if (fireHeld && local.alive){
    const w = WEAPONS[local.weapon];
    if (w.auto) tryFire();
  }

  updateMovement(dt);
  updateProjectiles(dt);
  updateCoins(dt);
  if (mode==='ai') updateBot(dt); else { updateRemoteInterp(dt); sendState(); }

  renderer.render(scene, camera);
}
</script>
